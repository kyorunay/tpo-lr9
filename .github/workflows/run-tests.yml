# Workflow GitHub Actions: запуск автотестов при каждом push
name: Run tests

# когда запускать
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:      # ручной запуск кнопкой в GitHub

jobs:
  test:
    # 1. операционная система виртуальной машины
    runs-on: ubuntu-latest

    steps:
      # 2. скачать код из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 3. установить Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 4. установить зависимости
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. запустить тесты
      - name: Run tests with pytest
        run: pytest -v
